<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Studio RAYEONJIN</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8fafc">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { align-content: start; min-height: calc(100vh - 200px); min-height: calc(100svh - 200px); }
    .lost .hero-links a::after { content: none; }
  </style>
  <script>
    // Saved theme, then the language: saved choice > browser > English (same order as the home page).
    (function () {
      var root = document.documentElement, langs = ["ko", "en", "zh", "es"], lang = null;
      try { if (localStorage.getItem("theme") === "dark") { root.dataset.theme = "dark"; document.querySelector('meta[name="theme-color"]').content = "#141b25"; } } catch (e) {}
      try { var s = localStorage.getItem("lang"); if (langs.indexOf(s) >= 0) lang = s; } catch (e) {}
      if (!lang) {
        var prefs = navigator.languages || [navigator.language || ""];
        for (var i = 0; i < prefs.length && !lang; i++) { var p = String(prefs[i]).toLowerCase().slice(0, 2); if (langs.indexOf(p) >= 0) lang = p; }
      }
      window.__lang = lang || "en";
      root.lang = { ko: "ko", en: "en", zh: "zh-Hans", es: "es" }[window.__lang];
    })();
  </script>
</head>
<body>

  <header class="menubar">
    <div class="menubar-inner">
      <a class="brand" href="/">
        <img src="/assets/mark.svg" alt="" width="18" height="18">
        <span>Studio RAYEONJIN</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero wrap lost">
      <p class="eyebrow">./404</p>
      <h1 id="t-title">이 페이지는 없습니다.</h1>
      <p class="lede" id="t-body">주소가 바뀌었거나 잘못 입력된 것 같아요. 처음 화면에서 다시 찾아 주세요.</p>
      <p class="hero-links"><a href="/" id="t-home">처음으로 돌아가기</a></p>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div class="brand brand-foot">
        <img src="/assets/mark.svg" alt="" width="20" height="20">
        <span>Studio RAYEONJIN</span>
      </div>
      <nav class="footer-links" aria-label="Links">
        <a href="https://github.com/Rayeonjin">GitHub</a>
        <a href="https://t.me/Rayeonjin">Telegram</a>
      </nav>
    </div>
  </footer>

  <script>
    (function () {
      var T = {
        en: ["This page doesn’t exist.", "The address may have changed, or it may have been mistyped. Try again from the home page.", "Back to home"],
        zh: ["这个页面不存在。", "地址可能已经变更，或者输入有误。请回到首页重新查找。", "返回首页"],
        es: ["Esta página no existe.", "Puede que la dirección haya cambiado o esté mal escrita. Vuelve a buscarla desde la página de inicio.", "Volver al inicio"]
      }[window.__lang];
      if (!T) return;
      document.getElementById("t-title").textContent = T[0];
      document.getElementById("t-body").textContent = T[1];
      document.getElementById("t-home").textContent = T[2];
    })();
  </script>
</body>
</html>
